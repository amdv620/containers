name: Build StableDiffusion ROCm Image

on:
  workflow_dispatch:
  push:
    paths:
      - 'stable-diffusion.cpp/*/**'
      - 'stable-diffusion.cpp/*'
      - '.github/workflows/build-stable-diffusion.cpp.yml'

env:
  REGISTRY: ghcr.io
  # Pull the dev image we just built as our base
  BASE_IMAGE_NAME: ${{ github.repository }}/rocm-dev
  FINAL_IMAGE_NAME: ${{ github.repository }}/stable-diffusion.cpp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Free up disk space (~30GB reclaimed)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Additional disk scrub
        run: |
          sudo rm -rf /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get purge -y -f 'llvm-*' 'mono-*' 'php*'
          sudo apt-get autoremove -y
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FINAL_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./stable-diffusion.cpp/
          file: ./stable-diffusion.cpp/Dockerfile
          push: true
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:latest
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
